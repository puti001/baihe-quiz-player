    <script>
        let currentSubjectKey = "00700";
        let activeYears = [];
        let currentYearIdx = 0;
        let currentQIdx = 0;
        let answered = false;
        let customDatabases = {};

        // 遊戲數值系統
        let score = 0;
        let combo = 0;
        let totalAnswered = 0;
        let totalCorrect = 0;
        let soundEnabled = true;

        /* ===== Web Audio API 原生音效合成引擎 (零延遲、免外部音檔) ===== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playGunshotSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            
            // 噪音脈衝模擬開火衝擊
            const bufferSize = audioCtx.sampleRate * 0.08;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + 0.08);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now);
        }

        function playCorrectChime(comboCount) {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;

            // 連擊音調遞增
            const baseFreq = 523.25; // C5
            const multiplier = Math.min(1 + (comboCount * 0.08), 2.2);
            
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq * multiplier, now + idx * 0.05);

                gain.gain.setValueAtTime(0.25, now + idx * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.05);
                osc.stop(now + idx * 0.05 + 0.36);
            });
        }

        function playWrongBuzz() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.linearRampToValueAtTime(90, now + 0.25);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.26);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                btn.classList.add('active');
                icon.innerText = "🔊";
                btn.innerHTML = `<span>🔊</span> 音效開`;
            } else {
                btn.classList.remove('active');
                icon.innerText = "🔇";
                btn.innerHTML = `<span>🔇</span> 音效關`;
            }
        }

        /* ===== Canvas 爆破粒子與粉碎動畫系統 ===== */
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 5 + 3;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
                this.gravity = 0.35;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnShatterFX(x, y, isSuccess) {
            const colors = isSuccess 
                ? ['#10b981', '#34d399', '#f59e0b', '#fbbf24', '#ffffff', '#38bdf8']
                : ['#ef4444', '#f87171', '#64748b', '#0f172a'];

            for (let i = 0; i < 40; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFX() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateFX);
        }
        animateFX();

        /* ===== 主應用邏輯 ===== */
        function initApp() {
            loadCustomDatabasesFromStorage();
            renderSubjectDropdown();

            const urlParams = new URLSearchParams(window.location.search);
            const paramSubject = urlParams.get('subject');

            if (paramSubject) {
                document.getElementById('subject-select').value = paramSubject;
                loadSubjectData(paramSubject);
            } else {
                loadSubjectData("00700");
            }
        }

        function loadCustomDatabasesFromStorage() {
            try {
                const stored = localStorage.getItem('puti_custom_quiz_banks');
                if (stored) {
                    customDatabases = JSON.parse(stored);
                }
            } catch (e) {
                console.error("Failed to load custom databases:", e);
            }
        }

        function renderSubjectDropdown() {
            const select = document.getElementById('subject-select');
            const customGroup = document.getElementById('custom-optgroup');
            customGroup.innerHTML = '';

            const customKeys = Object.keys(customDatabases);
            if (customKeys.length > 0) {
                customGroup.style.display = 'block';
                customKeys.forEach(k => {
                    const item = customDatabases[k];
                    const opt = document.createElement('option');
                    opt.value = k;
                    const totalQ = item.years.reduce((s, y) => s + y.questions.length, 0);
                    opt.innerText = `⭐ ${item.subjectName || k} (${item.years.length}份試卷，共${totalQ}題)`;
                    customGroup.appendChild(opt);
                });
            } else {
                customGroup.style.display = 'none';
            }
        }

        function onSubjectChange() {
            currentSubjectKey = document.getElementById('subject-select').value;
            score = 0;
            combo = 0;
            totalAnswered = 0;
            totalCorrect = 0;
            updateHUD();
            loadSubjectData(currentSubjectKey);
        }

        function loadSubjectData(key) {
            currentSubjectKey = key;
            let data = null;

            if (typeof fullBaihe5YearsDatabase !== 'undefined' && fullBaihe5YearsDatabase[key]) {
                data = fullBaihe5YearsDatabase[key];
            } else if (customDatabases[key]) {
                data = customDatabases[key];
            }

            if (!data) {
                alert(`查無【${key}】題庫資料！`);
                return;
            }

            // 依年度「最新到最舊 (降冪)」排列：115, 114, 113... 099
            activeYears = [...data.years].sort((a, b) => {
                const ya = parseInt(a.year) || 0;
                const yb = parseInt(b.year) || 0;
                return yb - ya;
            });
            
            let officialTotalQs = 0;
            if (typeof fullBaihe5YearsDatabase !== 'undefined') {
                Object.keys(fullBaihe5YearsDatabase).forEach(k => {
                    officialTotalQs += fullBaihe5YearsDatabase[k].years.reduce((s, y) => s + y.questions.length, 0);
                });
            }
            let customTotalQs = 0;
            Object.keys(customDatabases).forEach(k => {
                customTotalQs += customDatabases[k].years.reduce((s, y) => s + y.questions.length, 0);
            });

            document.getElementById('q-total-badge').innerText = `收錄 7 職類 9,360 題 + 自訂 ${customTotalQs} 題`;

            currentYearIdx = 0;
            renderYearTabs();
            loadYear(0);
        }

        function renderYearTabs() {
            const container = document.getElementById('year-tabs-container');
            container.innerHTML = '';
            activeYears.forEach((y, idx) => {
                const btn = document.createElement('button');
                btn.className = `year-tab ${idx === currentYearIdx ? 'active' : ''}`;
                btn.innerText = `📅 ${y.year} 年度`;
                btn.onclick = () => {
                    currentYearIdx = idx;
                    renderYearTabs();
                    loadYear(idx);
                };
                container.appendChild(btn);
            });
        }

        function loadYear(yearIdx) {
            currentYearIdx = yearIdx;
            currentQIdx = 0;
            loadQuestion();
        }

        function updateHUD() {
            document.getElementById('hud-score').innerText = score;
            const comboBadge = document.getElementById('hud-combo-badge');
            const comboText = document.getElementById('hud-combo-text');

            if (combo >= 2) {
                comboBadge.style.display = 'inline-block';
                comboBadge.innerText = `🔥 COMBO x${combo}`;
                comboText.style.display = 'none';
            } else {
                comboBadge.style.display = 'none';
                comboText.style.display = 'inline';
                comboText.innerText = combo === 1 ? '1 HIT' : 'READY';
            }

            const acc = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 100;
            document.getElementById('hud-accuracy').innerText = `${acc}%`;
        }

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('explanation-box').style.display = 'none';

            const yearObj = activeYears[currentYearIdx];
            if (!yearObj || !yearObj.questions || yearObj.questions.length === 0) {
                document.getElementById('question-title').innerText = "本試卷尚無題目";
                document.getElementById('options-list').innerHTML = '';
                return;
            }

            const q = yearObj.questions[currentQIdx];

            // 能量條進度
            const pct = Math.round(((currentQIdx + 1) / yearObj.questions.length) * 100);
            document.getElementById('energy-bar').style.width = `${pct}%`;

            const cleanTitle = (raw, i) => `[${i + 1}] ` + (raw ? raw.replace(/^(\[\d+\]|\(\d+\)|\d+[\.、\s\)]+)\s*/, '') : '');
            document.getElementById('progress-text').innerText = `${currentQIdx + 1} / ${yearObj.questions.length}`;
            document.getElementById('question-title').innerText = cleanTitle(q.title, currentQIdx);
            document.getElementById('status-hint').innerText = "🎯 瞄準選項並點擊擊發！";

            const list = document.getElementById('options-list');
            list.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const item = document.createElement('div');
                item.className = 'option-item';
                item.innerHTML = `
                    <span><b>(${idx + 1})</b> ${opt}</span>
                    <div class="crosshair-icon"></div>
                `;
                item.onclick = (e) => checkAnswer(idx, item, e);
                list.appendChild(item);
            });
        }

        function checkAnswer(selectedIdx, element, event) {
            if (answered) return;
            answered = true;
            totalAnswered++;

            const yearObj = activeYears[currentYearIdx];
            const q = yearObj.questions[currentQIdx];
            const items = document.querySelectorAll('.option-item');
            const isCorrect = selectedIdx === q.answer;

            // 開火音效
            playGunshotSound();

            // 生成擊發彈孔 (Bullet Hole) 視覺效果
            const rect = element.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;
            const hole = document.createElement('div');
            hole.className = 'bullet-hole';
            hole.style.left = `${clickX - 10}px`;
            hole.style.top = `${clickY - 10}px`;
            element.appendChild(hole);

            // 觸發物理粉碎粒子
            spawnShatterFX(event.clientX, event.clientY, isCorrect);

            if (items[q.answer]) {
                items[q.answer].classList.add('correct');
            }

            if (isCorrect) {
                totalCorrect++;
                combo++;
                const point = 100 + (combo * 20);
                score += point;
                element.classList.add('correct');
                document.getElementById('status-hint').innerHTML = `<span style="color:#059669; font-weight:800;">💥 爆破擊中！+${point} 分！(官方標準正解)</span>`;
                
                playCorrectChime(combo);

                // 震動回饋 (答對輕快雙震)
                if (navigator.vibrate) {
                    navigator.vibrate([35, 40, 45]);
                }
            } else {
                combo = 0;
                element.classList.add('wrong');
                document.getElementById('status-hint').innerHTML = `<span style="color:#dc2626; font-weight:800;">💥 彈道偏離！防護盾破裂！</span>`;
                
                // 震屏效果
                const card = document.getElementById('main-quiz-card');
                card.classList.remove('shake-screen');
                void card.offsetWidth; // trigger reflow
                card.classList.add('shake-screen');

                playWrongBuzz();

                // 震動回饋 (答錯長震)
                if (navigator.vibrate) {
                    navigator.vibrate([120, 60, 120]);
                }
            }

            updateHUD();

            const exp = document.getElementById('explanation-box');
            exp.innerHTML = `💡 <b>${q.explain || '標準解答：第 (' + (q.answer + 1) + ') 項'}</b>`;
            exp.style.display = 'block';

            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            const yearObj = activeYears[currentYearIdx];
            currentQIdx = (currentQIdx + 1) % yearObj.questions.length;
            loadQuestion();
        }

        function openInspectModal() {
            const yearObj = activeYears[currentYearIdx];
            const sName = document.getElementById('subject-select').selectedOptions[0].text;
            document.getElementById('modal-title').innerText = `📋 【${sName} - ${yearObj.year}年度】${yearObj.questions.length} 題全真題清單稽核`;

            const modalBody = document.getElementById('modal-list-body');
            modalBody.innerHTML = '';

            yearObj.questions.forEach((q, idx) => {
                const item = document.createElement('div');
                item.className = 'inspect-q-item';
                
                let optsHtml = '';
                q.options.forEach((opt, oIdx) => {
                    const isAns = oIdx === q.answer;
                    optsHtml += `<div class="${isAns ? 'inspect-opt-correct' : ''}">(${oIdx + 1}) ${opt} ${isAns ? '✔(標準正解)' : ''}</div>`;
                });

                item.innerHTML = `
                    <div class="inspect-q-title">${q.title}</div>
                    <div class="inspect-opts">${optsHtml}</div>
                    <div style="font-size:12px; color:#475569; background:#e2e8f0; padding:6px 10px; border-radius:6px; margin-top:4px;">
                        💡 <b>${q.explain || '標準解答：第 (' + (q.answer + 1) + ') 項'}</b>
                    </div>
                `;
                modalBody.appendChild(item);
            });

            document.getElementById('inspect-modal').style.display = 'flex';
        }

        function closeInspectModal() {
            document.getElementById('inspect-modal').style.display = 'none';
        }

        initApp();
    </script>
