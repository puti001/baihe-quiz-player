<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puti-AI | 7 大職類官方 PDF 真題播放器 (9,360題完全對齊發佈版)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4f7fc;
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }

        body {
            background-color: var(--bg-main); color: var(--text-dark);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px;
        }

        header {
            width: 100%; max-width: 880px; display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: var(--panel-bg); border-radius: 20px;
            box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px;
        }

        .brand-logo {
            font-size: 22px; font-weight: 700; font-family: 'Fredoka', cursive;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        main { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 16px; }

        .subject-selector-card {
            background: var(--panel-bg); border-radius: 20px; padding: 18px 24px;
            box-shadow: var(--shadow); border: 2px solid #c7d2fe; display: flex;
            flex-direction: column; gap: 10px;
        }

        .selector-header { display: flex; justify-content: space-between; align-items: center; }

        .selector-title {
            font-size: 15px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px;
        }

        select.subject-dropdown {
            width: 100%; padding: 12px 16px; border: 2px solid var(--primary);
            border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-dark);
            background: #f8fafc; outline: none; cursor: pointer; transition: all 0.2s;
        }

        .year-bar-wrapper {
            display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
        }

        .year-bar {
            display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; flex: 1;
        }

        .year-tab {
            background: #e2e8f0; border: none; padding: 10px 18px; border-radius: 20px;
            font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;
            white-space: nowrap; transition: all 0.2s;
        }
        .year-tab.active {
            background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .inspect-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white; border: none; padding: 10px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: all 0.2s;
        }

        .quiz-card {
            background: var(--panel-bg); border-radius: 24px; padding: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px;
        }

        .question-title { font-size: 18px; font-weight: 700; line-height: 1.6; }

        .option-item {
            background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px;
            padding: 14px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: space-between;
        }
        .option-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .option-item.correct { border-color: var(--success); background: #ecfdf5; color: #065f46; }
        .option-item.wrong { border-color: var(--danger); background: #fef2f2; color: #991b1b; }

        .explanation-box {
            background: #f1f5f9; border-left: 4px solid var(--primary); border-radius: 8px;
            padding: 12px; font-size: 14px; display: none; line-height: 1.5;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 999; padding: 20px;
        }

        .modal-content {
            background: white; border-radius: 24px; width: 95%; max-width: 900px; max-height: 85vh;
            display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px; background: #f8fafc; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .modal-body { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

        .inspect-q-item {
            background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .inspect-q-title { font-size: 15px; font-weight: 700; color: var(--text-dark); }
        .inspect-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; color: var(--text-muted); }
        .inspect-opt-correct { font-weight: 700; color: var(--success); }

        footer {
            width: 100%; max-width: 880px; margin-top: 24px; padding: 16px;
            background: var(--panel-bg); border-radius: 16px; border: 1px solid var(--border);
            text-align: center; font-size: 13px; color: var(--text-muted); line-height: 1.6;
        }
        footer a { color: var(--primary); font-weight: 700; text-decoration: none; }
    </style>

    <script src="full_baihe_5years_database.js"></script>
</head>
<body>

    <header>
        <div class="brand-logo">Puti-AI | 7 大職類官方 PDF 真題播放器</div>
        <span style="font-size:12px; color:#047857; background:#ecfdf5; font-weight:700; padding:4px 8px; border-radius:8px;">
            ✅ 已通過權威對齊驗證：117 份試卷、9,360 題
        </span>
    </header>

    <main>
        <div class="subject-selector-card">
            <div class="selector-header">
                <span class="selector-title">🏫 收錄 7 個已取得官方 PDF 之丙級職類（117 份試卷，共 9,360 題）：</span>
                <span style="font-size:12px; background:#e0e7ff; color:#4338ca; font-weight:700; padding:2px 8px; border-radius:6px;" id="q-total-badge">載入中...</span>
            </div>
            <select id="subject-select" class="subject-dropdown" onchange="onSubjectChange()">
                <option value="00700" selected>⚡ 00700 室內配線 - 屋內線路裝修 丙級 (099-115 年，17 年全套，1,360 題)</option>
                <option value="02000">🚗 02000 汽車修護 丙級 (099-115 年，17 年全套，1,360 題)</option>
                <option value="04200">📐 04200 測量 丙級 (099-115 年，17 年全套，1,360 題)</option>
                <option value="14500">🛵 14500 機器腳踏車修護 丙級 (099-115 年，17 年全套，1,360 題)</option>
                <option value="18300">🗜️ 18300 車床 - 車床項 丙級 (099-115 年，17 年全套，1,360 題)</option>
                <option value="18500">⚙️ 18500 機械加工 丙級 (099-115 年，17 年全套，1,360 題)</option>
                <option value="21101">🏛️ 21101 建築製圖應用 - 電腦繪圖 丙級 (101-115 年，15 年全套，1,200 題)</option>
            </select>
        </div>

        <div class="year-bar-wrapper">
            <div class="year-bar" id="year-tabs-container"></div>
            <button class="inspect-btn" onclick="openInspectModal()">📋 檢視【當前年度全清單】</button>
        </div>

        <div class="quiz-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="background:#dcfce7; color:#15803d; font-size:12px; font-weight:700; padding:4px 10px; border-radius:8px;" id="category-tag">100% 官方原廠 PDF 實體解析</span>
                <span style="font-size:13px; color:var(--text-muted); font-weight:700;" id="progress-text">1 / 80</span>
            </div>

            <div class="question-title" id="question-title">載入題目中...</div>
            <div style="display:flex; flex-direction:column; gap:10px;" id="options-list"></div>
            <div class="explanation-box" id="explanation-box"></div>

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; color:var(--text-muted);" id="status-hint">💡 點擊選項即可進行答題！</span>
                <button id="next-btn" onclick="nextQuestion()" disabled style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer;">下一題 ➔</button>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="inspect-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 style="font-size:18px; font-weight:700; color:var(--primary);" id="modal-title">當前年度 80 題全清單稽核</h3>
                    <p style="font-size:12px; color:var(--text-muted);">來自 Codex 下載之官方 PDF 100% 原始內容展覽</p>
                </div>
                <button onclick="closeInspectModal()" style="background:#f1f5f9; border:none; padding:8px 16px; border-radius:10px; font-weight:700; cursor:pointer;">✕ 關閉視窗</button>
            </div>
            <div class="modal-body" id="modal-list-body"></div>
        </div>
    </div>

    <footer>
        屏東縣後庄國小黃朝榮老師作品，免費分享，歡迎擴散推廣，嚴禁商用與任何侵權、不尊重著作權的行為，更多 Puti-AI 教學工具 <a href="https://padlet.com/clongwh/puti_ai_tools" target="_blank">點此前往</a>
    </footer>

    <script>
        let currentSubjectKey = "00700";
        let activeYears = [];
        let currentYearIdx = 0;
        let currentQIdx = 0;
        let answered = false;

        function onSubjectChange() {
            currentSubjectKey = document.getElementById('subject-select').value;
            loadSubjectData(currentSubjectKey);
        }

        function loadSubjectData(key) {
            const data = fullBaihe5YearsDatabase[key];
            if (!data) {
                alert(`無【${key}】實體 PDF 數據！絕不載入其他科目冒充。`);
                return;
            }

            activeYears = data.years;
            
            let grandTotalQs = 0;
            Object.keys(fullBaihe5YearsDatabase).forEach(k => {
                grandTotalQs += fullBaihe5YearsDatabase[k].years.reduce((s, y) => s + y.questions.length, 0);
            });

            document.getElementById('q-total-badge').innerText = `已載入 6 職類17年+21101 15年，共 ${grandTotalQs} 題`;

            currentYearIdx = 0;
            renderYearTabs();
            loadYear(0);
        }

        function renderYearTabs() {
            const container = document.getElementById('year-tabs-container');
            container.innerHTML = '';
            activeYears.forEach((y, idx) => {
                const btn = document.createElement('button');
                btn.className = `year-tab ${idx === currentYearIdx ? 'active' : ''}`;
                btn.innerText = `📅 ${y.year} 年度 (${y.questions.length}題考卷)`;
                btn.onclick = () => {
                    currentYearIdx = idx;
                    renderYearTabs();
                    loadYear(idx);
                };
                container.appendChild(btn);
            });
        }

        function loadYear(yearIdx) {
            currentYearIdx = yearIdx;
            currentQIdx = 0;
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('explanation-box').style.display = 'none';

            const yearObj = activeYears[currentYearIdx];
            const q = yearObj.questions[currentQIdx];

            document.getElementById('progress-text').innerText = `${currentQIdx + 1} / ${yearObj.questions.length}`;
            document.getElementById('question-title').innerText = q.title;

            const list = document.getElementById('options-list');
            list.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const item = document.createElement('div');
                item.className = 'option-item';
                item.innerHTML = `<span><b>(${idx + 1})</b> ${opt}</span>`;
                item.onclick = () => checkAnswer(idx, item);
                list.appendChild(item);
            });
        }

        function checkAnswer(selectedIdx, element) {
            if (answered) return;
            answered = true;

            const yearObj = activeYears[currentYearIdx];
            const q = yearObj.questions[currentQIdx];
            const items = document.querySelectorAll('.option-item');

            items[q.answer].classList.add('correct');

            if (selectedIdx === q.answer) {
                element.classList.add('correct');
                document.getElementById('status-hint').innerText = "✨ 答對了！(符合勞動部官方標準解答)";
            } else {
                element.classList.add('wrong');
                document.getElementById('status-hint').innerText = "💥 答錯了！";
            }

            const exp = document.getElementById('explanation-box');
            exp.innerHTML = `<b>${q.explain}</b>`;
            exp.style.display = 'block';

            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            const yearObj = activeYears[currentYearIdx];
            currentQIdx = (currentQIdx + 1) % yearObj.questions.length;
            loadQuestion();
        }

        function openInspectModal() {
            const yearObj = activeYears[currentYearIdx];
            const sName = document.getElementById('subject-select').selectedOptions[0].text;
            document.getElementById('modal-title').innerText = `📋 【${sName} - ${yearObj.year}年度】${yearObj.questions.length} 題全真題清單稽核`;

            const modalBody = document.getElementById('modal-list-body');
            modalBody.innerHTML = '';

            yearObj.questions.forEach((q, idx) => {
                const item = document.createElement('div');
                item.className = 'inspect-q-item';
                
                let optsHtml = '';
                q.options.forEach((opt, oIdx) => {
                    const isAns = oIdx === q.answer;
                    optsHtml += `<div class="${isAns ? 'inspect-opt-correct' : ''}">(${oIdx + 1}) ${opt} ${isAns ? '✔(官方正解)' : ''}</div>`;
                });

                item.innerHTML = `
                    <div class="inspect-q-title">${q.title}</div>
                    <div class="inspect-opts">${optsHtml}</div>
                    <div style="font-size:12px; color:#475569; background:#e2e8f0; padding:6px 10px; border-radius:6px; margin-top:4px;">
                        💡 <b>${q.explain}</b>
                    </div>
                `;
                modalBody.appendChild(item);
            });

            document.getElementById('inspect-modal').style.display = 'flex';
        }

        function closeInspectModal() {
            document.getElementById('inspect-modal').style.display = 'none';
        }

        loadSubjectData("00700");
    </script>
</body>
</html>
